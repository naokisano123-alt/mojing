name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'server/app/**'
      - 'package*.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'index.html'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'server/app/**'
      - 'package*.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'index.html'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: |
          sdk="$RUNNER_TEMP/android-sdk"
          cli="$RUNNER_TEMP/android-cli"
          mkdir -p "$sdk" "$cli"
          curl -fLsS --retry 3 -o "$cli/tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$cli/tools.zip" -d "$cli"
          manager="$cli/cmdline-tools/bin/sdkmanager"
          (set +o pipefail; yes | "$manager" --sdk_root="$sdk" --licenses) >/dev/null
          "$manager" --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0'
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: gradle -p android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mojing-android-arm64-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
